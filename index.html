<title>⛏ MC Map</title>
<style>

  body{position:fixed;inset:0;font-family:monospace;}

  .handle{display:flex;justify-content:center;padding:10px 0 4px;flex-shrink:0;}
  .handle-bar{width:36px;height:4px;border-radius:2px;background:#1e2a3a;}
  #sheet-content{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
  .sh-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;min-height:0;}

<script>
const STORAGE_KEY = "mc-map-pins-v4";

const CATS = [

  { name:"Nether/Portal", color:"#ff6a00", icon:"🔥" },
  { name:"Caves/Dark",    color:"#9b59b6", icon:"🕳"  },
  { name:"Biomes",        color:"#1abc9c", icon:"🌿" },

const catColor = n => (CATS.find(c=>c.name===n)||CATS[8]).color;
const catIcon  = n => (CATS.find(c=>c.name===n)||CATS[8]).icon;

const DEFAULT_PINS = [
  { id:"d1",  name:"Main House",        x:424,   y:67,  z:-100  , cat:"Home Base" },
  { id:"d2",  name:"Jazmine House",     x:466,   y:90,  z:-134  , cat:"Home Base" },

  { id:"d4",  name:"Nether Portal",     x:343,   y:-8,  z:-213  , cat:"Nether/Portal" },
  { id:"d5",  name:"Cave Portal",       x:564,   y:1,   z:492   , cat:"Nether/Portal" },
  { id:"d6",  name:"Nether Crimson",    x:-1046, y:34,  z:259   , cat:"Nether/Portal" },
  { id:"d7",  name:"Crimson Forest",    x:659,   y:38,  z:-427  , cat:"Nether/Portal" },
  { id:"d8",  name:"Nether Portal Far", x:13668, y:76,  z:-16361, cat:"Nether/Portal" },
  { id:"d9",  name:"Ruin Nether Portal",x:8410,  y:70,  z:-10079, cat:"Nether/Portal" },
  { id:"d10", name:"Axolotl Pool",      x:1065,  y:66,  z:-256  , cat:"Caves/Dark" },
  { id:"d11", name:"Max Giant Cave",    x:1156,  y:67,  z:152   , cat:"Caves/Dark" },
  { id:"d12", name:"Deep Dark",         x:5266,  y:-31, z:-3359 , cat:"Caves/Dark" },
  { id:"d13", name:"Insane Cave",       x:5275,  y:-20, z:-3440 , cat:"Caves/Dark" },
  { id:"d14", name:"Big Cave Ice+Dark", x:14536, y:62,  z:-16071, cat:"Caves/Dark" },
  { id:"d15", name:"Another Big Cave",  x:14174, y:63,  z:-15843, cat:"Caves/Dark" },
  { id:"d16", name:"Big Cave Mineshaft",x:9484,  y:66,  z:-4146 , cat:"Caves/Dark" },
  { id:"d17", name:"Lake Cave",         x:-794,  y:-20, z:-1169 , cat:"Caves/Dark" },
  { id:"d18", name:"Mineshaft",         x:-1210, y:-19, z:-5321 , cat:"Caves/Dark" },
  { id:"d19", name:"Mushroom Biome",    x:1198,  y:38,  z:-486  , cat:"Biomes" },
  { id:"d20", name:"Coral Reef",        x:4700,  y:0,   z:1800  , cat:"Biomes" },
  { id:"d21", name:"Iceberg Biome",     x:3154,  y:0,   z:-1607 , cat:"Biomes" },
  { id:"d22", name:"Pale Garden",       x:6018,  y:89,  z:-3108 , cat:"Biomes" },
  { id:"d23", name:"Blue Magic Biome",  x:-1807, y:0,   z:0     , cat:"Biomes" },
  { id:"d24", name:"Packed Ice",        x:1244,  y:63,  z:-6278 , cat:"Biomes" },

  { id:"d27", name:"Villager House",    x:454,   y:96,  z:1147  , cat:"Structures" },
  { id:"d28", name:"Sand Village",      x:-1445, y:71,  z:-2083 , cat:"Structures" },
  { id:"d29", name:"Olde House",        x:-854,  y:117, z:90    , cat:"Structures" },
  { id:"d30", name:"Ice Cave",          x:14637, y:53,  z:-12731, cat:"Structures" },
  { id:"d31", name:"Iron Farm",         x:5568,  y:104, z:-3487 , cat:"Farms/XP" },
  { id:"d32", name:"Zombie XP Farm",    x:-1590, y:64,  z:-958  , cat:"Farms/XP" },
  { id:"d33", name:"Stronghold",        x:-1437, y:9,   z:-2086 , cat:"Strongholds" },
  { id:"d34", name:"Stronghold Library",x:-1157, y:30,  z:-5353 , cat:"Strongholds" },
  { id:"d35", name:"2nd Stronghold",    x:-1450, y:-5,  z:-7384 , cat:"Strongholds" },
  { id:"d36", name:"Deep Dark Pale Gdn",x:6024,  y:-41, z:-2956 , cat:"Strongholds" },
  { id:"d37", name:"Parked Ghast",      x:-16500,y:88,  z:-28125, cat:"Far Out" },
  { id:"d38", name:"Random Point",      x:18496, y:70,  z:-5507 , cat:"Far Out" },
];

// ── State ─────────────────────────────────────────────────
let pins = [];
let hiddenCats = new Set();
let selectedId = null;
let currentSheet = null;
let editPin = null;
let form = { name:"", x:"", y:"64", z:"", cat:"Home Base" };
let searchText = "";
let bounds = { minX:-5000, maxX:15000, minZ:-8000, maxZ:3000 };

// transform
let sc = 1;
let pan = { x:0, y:0 };

// interaction
let isPanning = false;
let panStart = { x:0, y:0 };
let panAtStart = { x:0, y:0 };
let lastTouches = [];
let pinchStart = null;
let rafPending = false;

const canvas = document.getElementById("canvas");
const mapWrap = document.getElementById("map-wrap");
const selCard = document.getElementById("sel-card");
const backdrop = document.getElementById("backdrop");
const sheet = document.getElementById("sheet");
const sheetContent = document.getElementById("sheet-content");
const toastEl = document.getElementById("toast");
const helpOverlay = document.getElementById("help-overlay");
const helpModal = document.getElementById("help-modal");
const syncEl = document.getElementById("sync-status");

// ── JSONbin.io Shared Sync ────────────────────────────────
// Free shared cloud storage. Bin ID stored in localStorage after first creation.
// Share the bin ID with other devices via the sync button in the header.
const BIN_ID_KEY = "mc-map-bin-id-v1";

function localGet() {
  try { const v=localStorage.getItem(STORAGE_KEY); return v?JSON.parse(v):null; } catch { return null; }
}
function localSet(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}
function getBinId()   { return localStorage.getItem(BIN_ID_KEY)||null; }
function setBinId(id) { localStorage.setItem(BIN_ID_KEY, id); }

async function binLoad() {
  const id = getBinId(); if (!id) return null;
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, {
      headers:{"X-Access-Key":"$2a$10$Placeholder","X-Bin-Meta":"false"}
    });
    if (!r.ok) return null;
    const d = await r.json();
    return Array.isArray(d) ? d : null;
  } catch { return null; }
}

async function binCreate(data) {
  try {
    const r = await fetch("https://api.jsonbin.io/v3/b", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Bin-Name":"mc-map","X-Bin-Private":"false"},
      body: JSON.stringify(data)
    });
    if (!r.ok) return null;
    const d = await r.json();
    return d.metadata?.id || null;
  } catch { return null; }
}

async function binUpdate(id, data) {
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${id}`, {
      method:"PUT",
      headers:{"Content-Type":"application/json","X-Bin-Private":"false"},
      body: JSON.stringify(data)
    });
    return r.ok;
  } catch { return false; }
}

// ── Init ──────────────────────────────────────────────────
(async function init() {
  setSyncStatus("syncing…");
  let loaded = await binLoad();
  if (!loaded) loaded = localGet();
  pins = (loaded && loaded.length) ? loaded : JSON.parse(JSON.stringify(DEFAULT_PINS));
  localSet(pins);
  setSyncStatus("✓");
  setTimeout(()=>setSyncStatus(""), 2000);
  computeBounds();
  resize();
  redraw();

  // Poll every 30s for changes from other devices
  setInterval(async ()=>{
    const remote = await binLoad();
    if (remote && Array.isArray(remote) && JSON.stringify(remote)!==JSON.stringify(pins)) {
      pins = remote; localSet(pins); computeBounds();
      setSyncStatus("↓ updated"); setTimeout(()=>setSyncStatus(""),2000);
      redraw(); updateSelCard();
    }
  }, 30000);
})();

function setSyncStatus(msg) { syncEl.textContent = msg; }

function computeBounds() {
  if (!pins.length) return;
  const xs = [...pins.map(p=>p.x)].sort((a,b)=>a-b);
  const zs = [...pins.map(p=>p.z)].sort((a,b)=>a-b);
  const t = Math.floor(xs.length*0.1);
  const cx = xs.slice(t, xs.length-t);
  const cz = zs.slice(t, zs.length-t);
  const pad = 3000;
  bounds = {
    minX:(cx[0]??xs[0])-pad, maxX:(cx[cx.length-1]??xs[xs.length-1])+pad,
    minZ:(cz[0]??zs[0])-pad, maxZ:(cz[cz.length-1]??zs[zs.length-1])+pad,
  };
}

async function savePins(next) {
  pins = next;
  localSet(next);
  setSyncStatus("saving…");
  let ok = false;
  const id = getBinId();
  if (id) {
    ok = await binUpdate(id, next);
  } else {
    const newId = await binCreate(next);
    if (newId) { setBinId(newId); ok = true; }
  }
  setSyncStatus(ok ? "✓ saved" : "✓ local");
  setTimeout(()=>setSyncStatus(""), 2000);
  computeBounds();
  redraw();
}

// ── Coordinate helpers ────────────────────────────────────
function wToC(wx, wz) {
  const W=canvas.width, H=canvas.height;
  const nx=(wx-bounds.minX)/(bounds.maxX-bounds.minX);
  const nz=(wz-bounds.minZ)/(bounds.maxZ-bounds.minZ);
  return [nx*W*sc+pan.x, nz*H*sc+pan.y];
}

function resetView() { sc=1; pan={x:0,y:0}; redraw(); }

// ── Draw ──────────────────────────────────────────────────
function redraw() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending=false; drawMap(); });
}

function drawMap() {
  const W=canvas.width, H=canvas.height, s=sc;
  const ctx = canvas.getContext("2d");
  const visible = pins.filter(p=>!hiddenCats.has(p.cat));

  ctx.fillStyle="#070b0f"; ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
  const step=2000;
  for (let wx=Math.ceil(bounds.minX/step)*step; wx<=bounds.maxX; wx+=step) {
    const [sx]=wToC(wx,0); ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,H); ctx.stroke();
  }
  for (let wz=Math.ceil(bounds.minZ/step)*step; wz<=bounds.maxZ; wz+=step) {
    const [,sy]=wToC(0,wz); ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(W,sy); ctx.stroke();
  }

  // Axes
  const [ox,oy]=wToC(0,0);
  ctx.strokeStyle="rgba(255,255,255,0.1)"; ctx.lineWidth=1; ctx.setLineDash([4,5]);
  ctx.beginPath(); ctx.moveTo(ox,0); ctx.lineTo(ox,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.stroke();
  ctx.setLineDash([]);

  // West tint
  const wg=ctx.createLinearGradient(0,0,ox,0);
  wg.addColorStop(0,"rgba(150,0,0,0.1)"); wg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=wg; ctx.fillRect(0,0,ox,H);

  // Cardinals
  ctx.font="bold 11px monospace"; ctx.fillStyle="#FFD700aa";
  ctx.textAlign="center"; ctx.fillText("N",W/2,14); ctx.fillText("S",W/2,H-4);
  ctx.textAlign="left"; ctx.fillText("W",4,H/2+4);
  ctx.textAlign="right"; ctx.fillText("E",W-4,H/2+4);

  // Corridors
  const home=pins.find(p=>p.id==="d1");
  if (home) {
    const [hx,hy]=wToC(home.x,home.z);
    for (const p of visible) {
      const [cx2,cy2]=wToC(p.x,p.z);
      const dx=cx2-hx,dy=cy2-hy,len=Math.hypot(dx,dy)||1;
      const hw=Math.max(2,Math.min(12,400/len));
      const ppx=(-dy/len)*hw, ppy=(dx/len)*hw;
      const col=catColor(p.cat);
      const g=ctx.createLinearGradient(hx,hy,cx2,cy2);
      g.addColorStop(0,col+"00"); g.addColorStop(0.2,col+"15");
      g.addColorStop(0.8,col+"25"); g.addColorStop(1,col+"10");
      ctx.beginPath();
      ctx.moveTo(hx+ppx,hy+ppy); ctx.lineTo(cx2+ppx,cy2+ppy);
      ctx.lineTo(cx2-ppx,cy2-ppy); ctx.lineTo(hx-ppx,hy-ppy);
      ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    }
  }

  // Dots
  for (const p of visible) {
    const [cx2,cy2]=wToC(p.x,p.z);
    const col=catColor(p.cat), isSel=p.id===selectedId, r=isSel?9:5;
    const grd=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,r*2.5);
    grd.addColorStop(0,col+(isSel?"cc":"55")); grd.addColorStop(1,"transparent");
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx2,cy2,r*2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=isSel?"#fff":col; ctx.strokeStyle=isSel?col:"#000";
    ctx.lineWidth=isSel?2.5:1.5;
    ctx.beginPath(); ctx.arc(cx2,cy2,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  }

  // Labels
  if (s >= 1.5 || selectedId) {
    const fs=Math.min(13,9+s*1.2), LH=fs+4, CFS=fs-1, CLH=CFS+2, MARGIN=3;
    const placed=[];
    const ok=b=>!placed.some(q=>b.x1<q.x2+MARGIN&&b.x2>q.x1-MARGIN&&b.y1<q.y2+MARGIN&&b.y2>q.y1-MARGIN);
    const toLabel=selectedId?(s>=1.5?visible:visible.filter(p=>p.id===selectedId)):visible;
    const sorted=[...toLabel].sort((a,b)=>a.id===selectedId?1:b.id===selectedId?-1:0);

    for (const p of sorted) {
      const [cx2,cy2]=wToC(p.x,p.z);
      const col=catColor(p.cat), isSel=p.id===selectedId, r=isSel?9:5;
      const BH=LH+(isSel?CLH:0);
      ctx.font=`${isSel?"bold ":""}${fs}px monospace`;
      const tw=ctx.measureText(p.name).width;
      const DIRS=[[r+6,-LH/2],[-(tw+r+6),-LH/2],[-tw/2,-(r+BH)],[-tw/2,r+4],[r+4,-(r+BH)],[-(tw+r+4),-(r+BH)],[r+4,r+4],[-(tw+r+4),r+4]];
      let lx=cx2+r+6, topY=cy2-LH/2, placed_ok=false;
      for (const [ox2,oy2] of DIRS) {
        const tx=cx2+ox2, ty=cy2+oy2, box={x1:tx-2,y1:ty-2,x2:tx+tw+4,y2:ty+BH+2};
        if(ok(box)){lx=tx;topY=ty;placed.push(box);placed_ok=true;break;}
      }
      if(!placed_ok) placed.push({x1:lx-2,y1:topY-2,x2:lx+tw+4,y2:topY+BH+2});
      const lcx=lx+tw/2, lcy=topY+BH/2;
      if(Math.hypot(lcx-cx2,lcy-cy2)>r+10){
        ctx.strokeStyle=col+"44"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(cx2,cy2);
        ctx.lineTo(Math.max(lx,Math.min(lx+tw,cx2)),Math.max(topY,Math.min(topY+BH,cy2)));
        ctx.stroke();
      }
      ctx.fillStyle="rgba(4,8,18,0.87)"; ctx.fillRect(lx-2,topY,tw+4,BH);
      ctx.fillStyle=col; ctx.font=`${isSel?"bold ":""}${fs}px monospace`;
      ctx.textAlign="left"; ctx.fillText(p.name,lx,topY+LH-2);
      if(isSel||s>2.5){
        ctx.font=`${CFS}px monospace`; ctx.fillStyle=col+"99";
        ctx.fillText(`${p.x}, ${p.y??'?'}, ${p.z}`,lx,topY+LH+CLH-2);
      }
    }
  }

  // Update sel card
  updateSelCard();
}

// ── Resize ────────────────────────────────────────────────
function resize() {
  canvas.width  = mapWrap.clientWidth  || window.innerWidth;
  canvas.height = mapWrap.clientHeight || (window.innerHeight - 52);
  redraw();
}
window.addEventListener("resize", resize);
new ResizeObserver(resize).observe(mapWrap);

// ── Hit test ──────────────────────────────────────────────
function getCanvasXY(clientX, clientY) {
  const r=canvas.getBoundingClientRect();
  return [(clientX-r.left)*(canvas.width/r.width),(clientY-r.top)*(canvas.height/r.height)];
}

function hitTest(sx,sy) {
  let hit=null, best=22;
  for (const p of pins) {
    if (hiddenCats.has(p.cat)) continue;
    const [cx2,cy2]=wToC(p.x,p.z);
    const d=Math.hypot(sx-cx2,sy-cy2);
    if(d<best){best=d;hit=p;}
  }
  return hit;
}

// ── Mouse ─────────────────────────────────────────────────
canvas.addEventListener("mousedown", e=>{
  isPanning=true; panStart={x:e.clientX,y:e.clientY}; panAtStart={...pan};
});
canvas.addEventListener("mousemove", e=>{
  if(!isPanning)return;
  pan={x:panAtStart.x+(e.clientX-panStart.x),y:panAtStart.y+(e.clientY-panStart.y)};
  redraw();
});
canvas.addEventListener("mouseup", e=>{
  const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y; isPanning=false;
  if(Math.hypot(dx,dy)<5){const[sx,sy]=getCanvasXY(e.clientX,e.clientY);setSelected(hitTest(sx,sy)?.id??null);}
});
canvas.addEventListener("mouseleave", ()=>{ isPanning=false; });
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  const[sx,sy]=getCanvasXY(e.clientX,e.clientY),f=e.deltaY<0?1.15:0.87;
  const ns=Math.max(0.3,Math.min(12,sc*f));
  pan={x:sx-(sx-pan.x)*(ns/sc),y:sy-(sy-pan.y)*(ns/sc)};
  sc=ns; redraw();
}, {passive:false});

// ── Touch ─────────────────────────────────────────────────
canvas.addEventListener("touchstart", e=>{
  e.preventDefault();
  if(e.touches.length===1){
    isPanning=true; panStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; panAtStart={...pan}; pinchStart=null;
  } else if(e.touches.length===2){
    isPanning=false;
    const t0=e.touches[0],t1=e.touches[1];
    pinchStart={dist:Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY),sc,px:pan.x,py:pan.y,mx:(t0.clientX+t1.clientX)/2,my:(t0.clientY+t1.clientY)/2};
  }
  lastTouches=[...e.touches];
},{passive:false});

canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  if(e.touches.length===1&&isPanning){
    pan={x:panAtStart.x+(e.touches[0].clientX-panStart.x),y:panAtStart.y+(e.touches[0].clientY-panStart.y)};
    redraw();
  } else if(e.touches.length===2&&pinchStart){
    const t0=e.touches[0],t1=e.touches[1];
    const dist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    const ps=pinchStart, ns=Math.max(0.3,Math.min(12,ps.sc*(dist/ps.dist)));
    const[mx,my]=getCanvasXY(ps.mx,ps.my);
    sc=ns; pan={x:mx-(mx-ps.px)*(ns/ps.sc),y:my-(my-ps.py)*(ns/ps.sc)};
    redraw();
  }
},{passive:false});

canvas.addEventListener("touchend", e=>{
  e.preventDefault();
  if(e.changedTouches.length===1&&lastTouches.length===1&&e.touches.length===0){
    const t=e.changedTouches[0],t0=lastTouches[0];
    if(Math.hypot(t.clientX-t0.clientX,t.clientY-t0.clientY)<8){
      const[sx,sy]=getCanvasXY(t.clientX,t.clientY);
      setSelected(hitTest(sx,sy)?.id??null);
    }
  }
  isPanning=false; lastTouches=[...e.touches];
},{passive:false});

// ── Selected ──────────────────────────────────────────────
function setSelected(id) {
  selectedId=id; updateSelCard(); redraw();
}

function updateSelCard() {
  const p=pins.find(p=>p.id===selectedId);
  if(!p){ selCard.style.display="none"; return; }
  const col=catColor(p.cat);
  selCard.style.display="flex";
  selCard.style.border=`1.5px solid ${col}`;
  selCard.style.boxShadow=`0 0 24px ${col}44`;
  selCard.innerHTML=`
    <div style="width:10px;height:10px;border-radius:50%;background:${col};box-shadow:0 0 8px ${col};flex-shrink:0"></div>
    <div style="min-width:0;flex:1">
      <div style="color:${col};font-weight:bold;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div>
      <div style="color:#555;font-size:11px;margin-top:2px">${p.x}, ${p.y??'?'}, ${p.z} · ${p.cat}</div>
    </div>
    <button class="btn" id="edit-sel-btn" style="font-size:11px;padding:4px 8px">Edit</button>
    <button class="btn" id="close-sel-btn" style="font-size:11px;padding:4px 8px;color:#555">✕</button>
  `;
  document.getElementById("edit-sel-btn").onclick=()=>openEdit(p);
  document.getElementById("close-sel-btn").onclick=()=>setSelected(null);
}

// ── Fly to ────────────────────────────────────────────────
function flyTo(p) {
  const W=canvas.width, H=canvas.height;
  const nx=(p.x-bounds.minX)/(bounds.maxX-bounds.minX);
  const nz=(p.z-bounds.minZ)/(bounds.maxZ-bounds.minZ);
  const ts=Math.max(sc,3);
  sc=ts; pan={x:W/2-nx*W*ts, y:H/2-nz*H*ts};
  setSelected(p.id); closeSheet(); redraw();
}

// ── Zoom buttons ──────────────────────────────────────────
function zoomBtn(factor) {
  const sx=canvas.width/2, sy=canvas.height/2;
  const ns=Math.max(0.3,Math.min(12,sc*factor));
  pan={x:sx-(sx-pan.x)*(ns/sc),y:sy-(sy-pan.y)*(ns/sc)};
  sc=ns; redraw();
}

document.getElementById("btn-zoomin").onclick=()=>zoomBtn(1.35);
document.getElementById("btn-zoomout").onclick=()=>zoomBtn(1/1.35);
document.getElementById("btn-reset").onclick=resetView;

// ── Sheet management ──────────────────────────────────────
function openSheet(name) {
  currentSheet=name;
  sheet.style.display="flex";
  backdrop.style.display="block";
  if(name==="filter") renderFilter();
  else if(name==="list") renderList();
  else if(name==="add") renderForm();
  updateHeaderBtns();
}

function closeSheet() {
  currentSheet=null; sheet.style.display="none"; backdrop.style.display="none";
  updateHeaderBtns();
}

backdrop.onclick=closeSheet;

function updateHeaderBtns() {
  document.getElementById("btn-filter").className="btn"+(currentSheet==="filter"?" btn-active":"");
  document.getElementById("btn-list").className="btn"+(currentSheet==="list"?" btn-active":"");
}

document.getElementById("btn-filter").onclick=()=>currentSheet==="filter"?closeSheet():openSheet("filter");
document.getElementById("btn-list").onclick=()=>currentSheet==="list"?closeSheet():openSheet("list");

// ── Filter sheet ──────────────────────────────────────────
function renderFilter() {
  let html=`<div class="sec"><div class="sec-title">Categories <span style="color:#333;font-weight:normal;font-size:11px">tap to hide/show</span></div>`;
  for (const c of CATS) {
    const h=hiddenCats.has(c.name);
    html+=`<div class="cat-row" data-cat="${c.name}" style="opacity:${h?0.4:1};background:${h?"rgba(255,255,255,0.01)":"rgba(255,255,255,0.04)"};border:1px solid ${h?"#111820":c.color+"33"}">
      <span style="font-size:16px">${c.icon}</span>
      <div style="width:9px;height:9px;border-radius:50%;background:${c.color};box-shadow:${h?"none":"0 0 5px "+c.color}"></div>
      <span style="flex:1;font-size:13px;color:${h?"#444":c.color}">${c.name}</span>
      <span style="font-size:11px;padding:2px 8px;border-radius:3px;color:${h?"#c33":"#3a7a3a"};background:${h?"#150505":"#051505"};border:1px solid ${h?"#2a0a0a":"#0a2a0a"}">${h?"off":"on"}</span>
    </div>`;
  }
  html+=`<button class="full-btn full-btn-green" id="show-all-btn" style="margin-top:8px">Show All</button></div>`;
  sheetContent.innerHTML=html;
  sheetContent.querySelectorAll(".cat-row").forEach(el=>{
    el.onclick=()=>{ toggleCat(el.dataset.cat); renderFilter(); };
  });
  document.getElementById("show-all-btn").onclick=()=>{ hiddenCats=new Set(); renderFilter(); redraw(); };
}

function toggleCat(name) {
  hiddenCats.has(name)?hiddenCats.delete(name):hiddenCats.add(name); redraw();
}

// ── List sheet ────────────────────────────────────────────
function renderList() {
  const filtered=pins.filter(p=>p.name.toLowerCase().includes(searchText.toLowerCase())||String(p.x).includes(searchText)||String(p.z).includes(searchText));
  let html=`<div style="padding:6px 12px 8px;border-bottom:1px solid #0e1620;flex-shrink:0">
    <input class="inp" id="search-inp" placeholder="🔍 Search…" value="${escHtml(searchText)}" style="font-size:14px;padding:8px 10px"/>
  </div><div class="sh-body">`;
  if(!filtered.length) html+=`<div style="color:#333;text-align:center;padding:32px;font-family:monospace">No pins</div>`;
  for (const p of filtered) {
    const isSel=p.id===selectedId, col=catColor(p.cat);
    html+=`<div class="pin-row" data-id="${p.id}" style="border-left:3px solid ${isSel?col:"transparent"};background:${isSel?"rgba(255,255,255,0.04)":"transparent"}">
      <span style="font-size:16px">${catIcon(p.cat)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;color:${isSel?"#fff":"#bbb"};font-weight:${isSel?"bold":"normal"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(p.name)}</div>
        <div style="font-size:10px;color:#334;margin-top:1px">${p.x}, ${p.y??'?'}, ${p.z}</div>
      </div>
      <div style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0"></div>
    </div>`;
  }
  html+=`</div><div class="sh-foot"><button class="full-btn full-btn-green" id="add-from-list">＋ Add New Pin</button></div>`;
  sheetContent.innerHTML=html;
  document.getElementById("search-inp").oninput=e=>{ searchText=e.target.value; renderList(); };
  document.getElementById("search-inp").addEventListener("click",e=>e.stopPropagation());
  document.getElementById("add-from-list").onclick=openAdd;
  sheetContent.querySelectorAll(".pin-row").forEach(el=>{
    el.onclick=()=>{ const p=pins.find(p=>p.id===el.dataset.id); if(p) flyTo(p); };
  });
}

// ── Add/Edit form ─────────────────────────────────────────
function openAdd() { editPin=null; form={name:"",x:"",y:"64",z:"",cat:"Home Base"}; openSheet("add"); }
function openEdit(p) { editPin=p; form={name:p.name,x:String(p.x),y:String(p.y??64),z:String(p.z),cat:p.cat}; openSheet("add"); }

function renderForm() {
  let catPicks="";
  for (const c of CATS) {
    const sel=form.cat===c.name;
    catPicks+=`<div class="chip" data-cat="${c.name}" style="border:1px solid ${sel?c.color:"#1a2535"};background:${sel?c.color+"22":"transparent"};color:${sel?c.color:"#445"}">${c.icon} ${c.name}</div>`;
  }
  const html=`<div class="form-wrap">
    <div class="form-hdr">
      <span style="color:#FFD700;font-weight:bold;font-size:14px">${editPin?"Edit Pin":"Add Pin"}</span>
      <button class="btn" id="close-form-btn" style="font-size:11px;padding:4px 8px">✕</button>
    </div>
    <label class="lbl">Name</label>
    <input class="inp" id="f-name" value="${escHtml(form.name)}" placeholder="e.g. My Base" style="margin-bottom:12px"/>
    <div class="row3">
      <div><label class="lbl">X</label><input class="inp" id="f-x" type="number" value="${form.x}" placeholder="424"/></div>
      <div><label class="lbl">Y</label><input class="inp" id="f-y" type="number" value="${form.y}" placeholder="64"/></div>
      <div><label class="lbl">Z</label><input class="inp" id="f-z" type="number" value="${form.z}" placeholder="-100"/></div>
    </div>
    <label class="lbl">Category</label>
    <div class="cat-pick" id="cat-pick">${catPicks}</div>
    <button class="full-btn full-btn-green" id="submit-form-btn" style="font-weight:bold">${editPin?"Save Changes":"Add to Map"}</button>
    ${editPin?`<button class="full-btn full-btn-red" id="delete-pin-btn">Delete Pin</button>`:""}
  </div>`;
  sheetContent.innerHTML=html;

  // Stop clicks inside inputs from closing sheet
  sheetContent.querySelectorAll("input").forEach(el=>el.addEventListener("click",e=>e.stopPropagation()));

  document.getElementById("close-form-btn").onclick=closeSheet;
  document.getElementById("submit-form-btn").onclick=submitForm;
  if(editPin) document.getElementById("delete-pin-btn").onclick=()=>deletePin(editPin.id);
  sheetContent.querySelectorAll(".chip").forEach(el=>{
    el.onclick=()=>{ form.cat=el.dataset.cat; renderForm(); };
  });
  // Sync inputs to form
  ["name","x","y","z"].forEach(k=>{
    document.getElementById("f-"+k).oninput=e=>{ form[k]=e.target.value; };
  });
}

async function submitForm() {
  const name=document.getElementById("f-name").value.trim();
  const x=parseInt(document.getElementById("f-x").value);
  const y=parseInt(document.getElementById("f-y").value);
  const z=parseInt(document.getElementById("f-z").value);
  if(!name||isNaN(x)||isNaN(y)||isNaN(z)){showToast("Fill all fields");return;}
  let next;
  if(editPin){ next=pins.map(p=>p.id===editPin.id?{...p,name,x,y,z,cat:form.cat}:p); selectedId=editPin.id; }
  else{ const np={id:Date.now().toString(),name,x,y,z,cat:form.cat}; next=[...pins,np]; selectedId=np.id; }
  await savePins(next); showToast(editPin?"Updated!":"Added!"); closeSheet(); editPin=null;
  updateSelCard(); redraw();
}

async function deletePin(id) {
  await savePins(pins.filter(p=>p.id!==id));
  if(selectedId===id){selectedId=null;updateSelCard();}
  showToast("Deleted"); closeSheet();
}

// ── Toast ─────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  toastEl.textContent=msg; toastEl.style.display="block";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.style.display="none",2000);
}

// ── Sync / Share UI ──────────────────────────────────────
document.getElementById("btn-sync").onclick = () => {
  const id = getBinId();
  const modal = document.createElement("div");
  modal.style.cssText="position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7)";
  const box = document.createElement("div");
  box.style.cssText="background:#0c1220;border:1px solid #1e2a3a;border-radius:12px;padding:20px;width:min(90vw,360px);font-family:monospace;color:#aaa;font-size:13px";
  box.innerHTML = `
    <div style="color:#FFD700;font-weight:bold;font-size:14px;margin-bottom:12px">☁ Sync Between Devices</div>
    <p style="margin:0 0 12px;color:#667;font-size:12px;line-height:1.5">To sync with another device, copy this Sync ID and paste it on that device.</p>
    <label style="font-size:10px;color:#445;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:5px">Your Sync ID</label>
    <input id="sync-id-inp" style="background:#060b12;color:#5dde5d;border:1px solid #1a2535;padding:9px 10px;font-family:monospace;font-size:12px;width:100%;border-radius:4px;outline:none;margin-bottom:10px" value="${id||'No sync yet — add or edit a pin first'}" readonly/>
    <button id="copy-id-btn" style="width:100%;padding:10px;background:#071207;color:#5dde5d;border:1px solid #1e4020;border-radius:6px;font-family:monospace;font-size:13px;cursor:pointer;margin-bottom:8px">Copy Sync ID</button>
    <div style="color:#445;font-size:11px;margin:8px 0 12px;text-align:center">— or paste a Sync ID from another device —</div>
    <input id="paste-id-inp" placeholder="Paste Sync ID here…" style="background:#060b12;color:#ddd;border:1px solid #1a2535;padding:9px 10px;font-family:monospace;font-size:12px;width:100%;border-radius:4px;outline:none;margin-bottom:10px"/>
    <button id="apply-id-btn" style="width:100%;padding:10px;background:#0c1220;color:#7aadff;border:1px solid #1a2535;border-radius:6px;font-family:monospace;font-size:13px;cursor:pointer;margin-bottom:12px">Use This Sync ID</button>
    <button id="close-sync-btn" style="width:100%;padding:8px;background:transparent;color:#445;border:1px solid #111820;border-radius:6px;font-family:monospace;font-size:12px;cursor:pointer">Close</button>
  `;
  modal.appendChild(box);
  document.body.appendChild(modal);
  modal.querySelector("#copy-id-btn").onclick = () => {
    const inp = modal.querySelector("#sync-id-inp");
    inp.select(); navigator.clipboard?.writeText(inp.value).catch(()=>{});
    modal.querySelector("#copy-id-btn").textContent = "✓ Copied!";
  };
  modal.querySelector("#apply-id-btn").onclick = async () => {
    const newId = modal.querySelector("#paste-id-inp").value.trim();
    if (!newId) return;
    setBinId(newId);
    modal.querySelector("#apply-id-btn").textContent = "Loading…";
    const remote = await binLoad();
    if (remote) { pins=remote; localSet(pins); computeBounds(); redraw(); updateSelCard(); showToast("Synced!"); }
    else showToast("Couldn't load that ID");
    document.body.removeChild(modal);
  };
  modal.querySelector("#close-sync-btn").onclick = () => document.body.removeChild(modal);
  modal.onclick = e => { if(e.target===modal) document.body.removeChild(modal); };
};

// ── Utils ─────────────────────────────────────────────────
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

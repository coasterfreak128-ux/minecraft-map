<title>Minecraft GALS</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0f0a04;overflow:hidden;}
  body{position:fixed;inset:0;font-family:Georgia,'Times New Roman',serif;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:#0f0a04;overflow:hidden;user-select:none;-webkit-user-select:none;}
  #header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid #3a2508;flex-shrink:0;z-index:10;gap:6px;background:#1a0f04;min-height:0;}
  .h-left{display:flex;align-items:center;gap:6px;flex-shrink:1;min-width:0;}
  .title{color:#d4a843;font-weight:bold;font-size:13px;letter-spacing:0.5px;font-family:Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sync{font-size:9px;color:#6a4a20;min-width:0;flex-shrink:1;font-family:Georgia,serif;white-space:nowrap;}
  .h-btns{display:flex;gap:3px;flex-shrink:0;}
  #map-wrap{flex:1;position:relative;overflow:hidden;}
  #canvas{display:block;width:100%;height:100%;touch-action:none;}
  .hint{position:absolute;bottom:8px;right:10px;font-size:9px;color:#3a2508;pointer-events:none;font-family:Georgia,serif;letter-spacing:1px;}
  .sel-card{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,8,2,0.96);padding:10px 14px;border-radius:6px;display:flex;align-items:center;gap:10px;max-width:92vw;z-index:20;font-family:Georgia,serif;}
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:29;display:none;}
  #sheet{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#140c04;border-top:1px solid #3a2508;border-radius:14px 14px 0 0;height:78vh;display:none;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,0.8);padding-bottom:env(safe-area-inset-bottom);}
  .handle{display:flex;justify-content:center;padding:10px 0 4px;flex-shrink:0;}
  .handle-bar{width:36px;height:4px;border-radius:2px;background:#3a2508;}
  #sheet-content{display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
  .sh-body{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;min-height:0;}
  .sh-foot{padding:8px 12px 20px;border-top:1px solid #2a1808;flex-shrink:0;}
  .sec{padding:8px 14px 20px;}
  .sec-title{color:#d4a843;font-weight:bold;font-size:13px;margin-bottom:10px;font-family:Georgia,serif;letter-spacing:0.5px;}
  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:5px;cursor:pointer;margin-bottom:4px;}
  .pin-row{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-left:3px solid transparent;}
  .form-wrap{padding:8px 16px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .form-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .row3{display:flex;gap:8px;margin-bottom:12px;}
  .row3>div{flex:1;}
  .cat-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:12px;font-family:Georgia,serif;border:1px solid #2a1808;background:transparent;color:#6a4a20;}
  #toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#1a1004;border:1px solid #5a3a10;padding:8px 20px;font-size:12px;color:#d4a843;border-radius:20px;z-index:100;pointer-events:none;display:none;font-family:Georgia,serif;}
  #help-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:49;display:none;}
  #help-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:#140c04;border:1px solid #3a2508;border-radius:10px;width:min(92vw,380px);max-height:82vh;overflow:hidden;display:none;flex-direction:column;box-shadow:0 8px 48px rgba(0,0,0,0.9);}

  button.btn{background:#1a0f04;color:#8a6020;border:1px solid #3a2508;padding:4px 8px;cursor:pointer;font-family:Georgia,serif;font-size:12px;border-radius:4px;min-width:26px;}
  button.btn:active{background:#241508;}

  button.btn-amber{background:#1e1204;color:#d4a843;border-color:#6a4a20;}
  input.inp{background:#0c0702;color:#d4c080;border:1px solid #3a2508;padding:9px 10px;font-family:Georgia,serif;font-size:13px;width:100%;border-radius:4px;outline:none;display:block;}

  button.full-btn-amber{color:#d4a843;border-color:#6a4a20;background:#1a1004;}
  button.full-btn-red{color:#c04030;border-color:#4a1808;background:#180804;}
</style>

<body>

      <span class="title">⛏ Minecraft GALS</span>
      <span class="sync" id="sync-status"></span>

      <button class="btn" id="btn-close-help" style="font-size:12px;padding:3px 8px">✕</button>
    </div>
    <div class="modal-body" id="help-body"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "mc-gals-pins-v1";
const BIN_ID_KEY  = "mc-gals-bin-id-v1";

const CATS = [

  { name:"Nether/Portal", color:"#c0501a", sym:"▲" },
  { name:"Caves/Dark",    color:"#8060c0", sym:"◎" },
  { name:"Biomes",        color:"#4a9c3f", sym:"✦" },
  { name:"Structures",    color:"#c0a020", sym:"⬡" },
  { name:"Farms/XP",      color:"#909080", sym:"⚙" },
  { name:"Strongholds",   color:"#c0204a", sym:"✛" },
  { name:"Far Out",       color:"#2060a0", sym:"◈" },
  { name:"Other",         color:"#707060", sym:"•" },
];
const catColor = n => (CATS.find(c=>c.name===n)||CATS[8]).color;
const catSym   = n => (CATS.find(c=>c.name===n)||CATS[8]).sym;

const DEFAULT_PINS = [
  { id:"d1",  name:"Main House",        x:424,   y:67,  z:-100  , cat:"Home Base" },
  { id:"d2",  name:"Jazmine House",     x:466,   y:90,  z:-134  , cat:"Home Base" },
  { id:"d3",  name:"Chest Room",        x:397,   y:86,  z:-69   , cat:"Home Base" },
  { id:"d4",  name:"Nether Portal",     x:343,   y:-8,  z:-213  , cat:"Nether/Portal" },
  { id:"d5",  name:"Cave Portal",       x:564,   y:1,   z:492   , cat:"Nether/Portal" },
  { id:"d6",  name:"Nether Crimson",    x:-1046, y:34,  z:259   , cat:"Nether/Portal" },
  { id:"d7",  name:"Crimson Forest",    x:659,   y:38,  z:-427  , cat:"Nether/Portal" },
  { id:"d8",  name:"Nether Portal Far", x:13668, y:76,  z:-16361, cat:"Nether/Portal" },
  { id:"d9",  name:"Ruin Nether Portal",x:8410,  y:70,  z:-10079, cat:"Nether/Portal" },
  { id:"d10", name:"Axolotl Pool",      x:1065,  y:66,  z:-256  , cat:"Caves/Dark" },
  { id:"d11", name:"Max Giant Cave",    x:1156,  y:67,  z:152   , cat:"Caves/Dark" },
  { id:"d12", name:"Deep Dark",         x:5266,  y:-31, z:-3359 , cat:"Caves/Dark" },
  { id:"d13", name:"Insane Cave",       x:5275,  y:-20, z:-3440 , cat:"Caves/Dark" },
  { id:"d14", name:"Big Cave Ice+Dark", x:14536, y:62,  z:-16071, cat:"Caves/Dark" },
  { id:"d15", name:"Another Big Cave",  x:14174, y:63,  z:-15843, cat:"Caves/Dark" },
  { id:"d16", name:"Big Cave Mineshaft",x:9484,  y:66,  z:-4146 , cat:"Caves/Dark" },
  { id:"d17", name:"Lake Cave",         x:-794,  y:-20, z:-1169 , cat:"Caves/Dark" },
  { id:"d18", name:"Mineshaft",         x:-1210, y:-19, z:-5321 , cat:"Caves/Dark" },
  { id:"d19", name:"Mushroom Biome",    x:1198,  y:38,  z:-486  , cat:"Biomes" },
  { id:"d20", name:"Coral Reef",        x:4700,  y:0,   z:1800  , cat:"Biomes" },
  { id:"d21", name:"Iceberg Biome",     x:3154,  y:0,   z:-1607 , cat:"Biomes" },
  { id:"d22", name:"Pale Garden",       x:6018,  y:89,  z:-3108 , cat:"Biomes" },
  { id:"d23", name:"Blue Magic Biome",  x:-1807, y:0,   z:0     , cat:"Biomes" },
  { id:"d24", name:"Packed Ice",        x:1244,  y:63,  z:-6278 , cat:"Biomes" },
  { id:"d25", name:"Light on Mountain", x:660,   y:139, z:884   , cat:"Structures" },
  { id:"d26", name:"Igloo Village",     x:743,   y:107, z:1133  , cat:"Structures" },
  { id:"d27", name:"Villager House",    x:454,   y:96,  z:1147  , cat:"Structures" },
  { id:"d28", name:"Sand Village",      x:-1445, y:71,  z:-2083 , cat:"Structures" },
  { id:"d29", name:"Olde House",        x:-854,  y:117, z:90    , cat:"Structures" },
  { id:"d30", name:"Ice Cave",          x:14637, y:53,  z:-12731, cat:"Structures" },
  { id:"d31", name:"Iron Farm",         x:5568,  y:104, z:-3487 , cat:"Farms/XP" },
  { id:"d32", name:"Zombie XP Farm",    x:-1590, y:64,  z:-958  , cat:"Farms/XP" },
  { id:"d33", name:"Stronghold",        x:-1437, y:9,   z:-2086 , cat:"Strongholds" },
  { id:"d34", name:"Stronghold Library",x:-1157, y:30,  z:-5353 , cat:"Strongholds" },
  { id:"d35", name:"2nd Stronghold",    x:-1450, y:-5,  z:-7384 , cat:"Strongholds" },
  { id:"d36", name:"Deep Dark Pale Gdn",x:6024,  y:-41, z:-2956 , cat:"Strongholds" },
  { id:"d37", name:"Parked Ghast",      x:-16500,y:88,  z:-28125, cat:"Far Out" },
  { id:"d38", name:"Random Point",      x:18496, y:70,  z:-5507 , cat:"Far Out" },
];

// ── State ─────────────────────────────────────────────────
let pins=[], hiddenCats=new Set(), selectedId=null, currentSheet=null;
let editPin=null, form={name:"",x:"",y:"64",z:"",cat:"Home Base"}, searchText="";
let bounds={minX:-5000,maxX:15000,minZ:-8000,maxZ:3000};
let sc=1, pan={x:0,y:0};
let isPanning=false, panStart={x:0,y:0}, panAtStart={x:0,y:0};
let lastTouches=[], pinchStart=null, rafPending=false;

const canvas=document.getElementById("canvas");
const mapWrap=document.getElementById("map-wrap");
const selCard=document.getElementById("sel-card");
const backdrop=document.getElementById("backdrop");
const sheet=document.getElementById("sheet");
const sheetContent=document.getElementById("sheet-content");
const toastEl=document.getElementById("toast");
const helpOverlay=document.getElementById("help-overlay");
const helpModal=document.getElementById("help-modal");
const syncEl=document.getElementById("sync-status");

// ── Storage ───────────────────────────────────────────────
function localGet(){try{const v=localStorage.getItem(STORAGE_KEY);return v?JSON.parse(v):null;}catch{return null;}}
function localSet(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch{}}
function getBinId(){return localStorage.getItem(BIN_ID_KEY)||null;}
function setBinId(id){localStorage.setItem(BIN_ID_KEY,id);}

async function binLoad(){
  const id=getBinId();if(!id)return null;
  try{const r=await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`,{headers:{"X-Bin-Meta":"false"}});if(!r.ok)return null;const d=await r.json();return Array.isArray(d)?d:null;}
  catch{return null;}
}
async function binCreate(data){
  try{const r=await fetch("https://api.jsonbin.io/v3/b",{method:"POST",headers:{"Content-Type":"application/json","X-Bin-Name":"mc-gals","X-Bin-Private":"false"},body:JSON.stringify(data)});if(!r.ok)return null;const d=await r.json();return d.metadata?.id||null;}
  catch{return null;}
}
async function binUpdate(id,data){
  try{const r=await fetch(`https://api.jsonbin.io/v3/b/${id}`,{method:"PUT",headers:{"Content-Type":"application/json","X-Bin-Private":"false"},body:JSON.stringify(data)});return r.ok;}
  catch{return false;}
}

// ── Init ──────────────────────────────────────────────────
(async function init(){
  setSyncStatus("loading…");
  let loaded=await binLoad();
  if(!loaded)loaded=localGet();
  pins=(loaded&&loaded.length)?loaded:JSON.parse(JSON.stringify(DEFAULT_PINS));
  localSet(pins);setSyncStatus("✓");setTimeout(()=>setSyncStatus(""),2000);
  computeBounds();resize();redraw();
  setInterval(async()=>{
    const remote=await binLoad();
    if(remote&&Array.isArray(remote)&&JSON.stringify(remote)!==JSON.stringify(pins)){
      pins=remote;localSet(pins);computeBounds();
      setSyncStatus("↓ updated");setTimeout(()=>setSyncStatus(""),2000);
      redraw();updateSelCard();
    }
  },30000);
})();

function setSyncStatus(m){syncEl.textContent=m;}

function computeBounds(){
  if(!pins.length)return;
  const xs=[...pins.map(p=>p.x)].sort((a,b)=>a-b);
  const zs=[...pins.map(p=>p.z)].sort((a,b)=>a-b);
  const t=Math.floor(xs.length*0.1);
  const cx=xs.slice(t,xs.length-t),cz=zs.slice(t,zs.length-t),pad=3000;
  bounds={minX:(cx[0]??xs[0])-pad,maxX:(cx[cx.length-1]??xs[xs.length-1])+pad,minZ:(cz[0]??zs[0])-pad,maxZ:(cz[cz.length-1]??zs[zs.length-1])+pad};
}

async function savePins(next){
  pins=next;localSet(next);setSyncStatus("saving…");
  const id=getBinId();let ok=false;
  if(id){ok=await binUpdate(id,next);}
  else{const nid=await binCreate(next);if(nid){setBinId(nid);ok=true;}}
  setSyncStatus(ok?"✓ saved":"✓ local");setTimeout(()=>setSyncStatus(""),2000);
  computeBounds();redraw();
}

// ── Coordinates ───────────────────────────────────────────
function wToC(wx,wz){
  const W=canvas.width,H=canvas.height;
  const nx=(wx-bounds.minX)/(bounds.maxX-bounds.minX);
  const nz=(wz-bounds.minZ)/(bounds.maxZ-bounds.minZ);
  return[nx*W*sc+pan.x,nz*H*sc+pan.y];
}
function resetView(){sc=1;pan={x:0,y:0};redraw();}

// ── Dynamic grid ──────────────────────────────────────────
function gridStep(){
  const worldWidth=(bounds.maxX-bounds.minX)/sc;
  const rawStep=worldWidth/6;
  const mag=Math.pow(10,Math.floor(Math.log10(Math.max(rawStep,1))));
  for(const n of[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000]){
    if(mag*n>=rawStep*0.6)return Math.max(50,mag*n);
  }
  return 20000;
}

// ── Draw ──────────────────────────────────────────────────
function redraw(){if(rafPending)return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;drawMap();});}

function drawMap(){
  const W=canvas.width,H=canvas.height,s=sc;
  const ctx=canvas.getContext("2d");
  const visible=pins.filter(p=>!hiddenCats.has(p.cat));

  // Leather background
  ctx.fillStyle="#0f0a04";ctx.fillRect(0,0,W,H);

  // Vignette
  const vig=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.85);
  vig.addColorStop(0,"rgba(0,0,0,0)");vig.addColorStop(1,"rgba(0,0,0,0.45)");
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);

  // Dynamic grid
  const step=gridStep();
  ctx.strokeStyle="rgba(90,58,14,0.22)";ctx.lineWidth=0.5;ctx.setLineDash([]);
  for(let wx=Math.ceil(bounds.minX/step)*step;wx<=bounds.maxX;wx+=step){
    const[sx]=wToC(wx,0);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke();
  }
  for(let wz=Math.ceil(bounds.minZ/step)*step;wz<=bounds.maxZ;wz+=step){
    const[,sy]=wToC(0,wz);ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke();
  }

  // Coordinate labels when zoomed in
  if(s>=2){
    ctx.font="9px Georgia,serif";ctx.fillStyle="rgba(160,110,40,0.45)";
    for(let wx=Math.ceil(bounds.minX/step)*step;wx<=bounds.maxX;wx+=step){
      const[sx]=wToC(wx,0);if(sx>30&&sx<W-30){ctx.textAlign="center";ctx.fillText(wx,sx,11);}
    }
    for(let wz=Math.ceil(bounds.minZ/step)*step;wz<=bounds.maxZ;wz+=step){
      const[,sy]=wToC(0,wz);if(sy>12&&sy<H-8){ctx.textAlign="left";ctx.fillText(wz,4,sy+3);}
    }
  }

  // Axes
  const[ox,oy]=wToC(0,0);
  ctx.strokeStyle="rgba(140,90,20,0.35)";ctx.lineWidth=0.8;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(ox,0);ctx.lineTo(ox,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.stroke();
  ctx.setLineDash([]);

  // West shadow
  if(ox>0){
    const wg=ctx.createLinearGradient(0,0,Math.min(ox,W*0.25),0);
    wg.addColorStop(0,"rgba(60,15,0,0.15)");wg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=wg;ctx.fillRect(0,0,Math.min(ox,W*0.25),H);
  }

  // Cardinals with axis info
  ctx.font="bold 10px Georgia,serif";ctx.fillStyle="rgba(212,168,67,0.65)";
  ctx.textAlign="center";
  ctx.fillText("N  −Z",W/2,14);
  ctx.fillText("S  +Z",W/2,H-4);
  ctx.textAlign="left"; ctx.fillText("W  −X",4,H/2+4);
  ctx.textAlign="right";ctx.fillText("E  +X",W-4,H/2+4);

  // Corridors from home
  const home=pins.find(p=>p.id==="d1");
  if(home){
    const[hx,hy]=wToC(home.x,home.z);
    for(const p of visible){
      const[cx2,cy2]=wToC(p.x,p.z);
      const dx=cx2-hx,dy=cy2-hy,len=Math.hypot(dx,dy)||1;
      const hw=Math.max(1.5,Math.min(10,350/len));
      const ppx=(-dy/len)*hw,ppy=(dx/len)*hw;
      const col=catColor(p.cat);
      const g=ctx.createLinearGradient(hx,hy,cx2,cy2);
      g.addColorStop(0,col+"00");g.addColorStop(0.3,col+"10");
      g.addColorStop(0.8,col+"20");g.addColorStop(1,col+"08");
      ctx.beginPath();ctx.moveTo(hx+ppx,hy+ppy);ctx.lineTo(cx2+ppx,cy2+ppy);
      ctx.lineTo(cx2-ppx,cy2-ppy);ctx.lineTo(hx-ppx,hy-ppy);
      ctx.closePath();ctx.fillStyle=g;ctx.fill();
    }
  }

  // Dots
  for(const p of visible){
    const[cx2,cy2]=wToC(p.x,p.z);
    const col=catColor(p.cat),isSel=p.id===selectedId,r=isSel?8:4.5;
    const grd=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,r*3);
    grd.addColorStop(0,col+(isSel?"88":"2a"));grd.addColorStop(1,"transparent");
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx2,cy2,r*3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=isSel?"#f0d870":col;
    ctx.strokeStyle=isSel?"#5a3a0a":"rgba(0,0,0,0.7)";
    ctx.lineWidth=isSel?2:1;
    ctx.beginPath();ctx.arc(cx2,cy2,r,0,Math.PI*2);ctx.fill();ctx.stroke();
  }

  // Labels
  if(s>=1.5||selectedId){
    const fs=Math.min(13,9+s*1.1),LH=fs+4,CFS=fs-1,CLH=CFS+2,MARGIN=3;
    const placed=[];
    const ok=b=>!placed.some(q=>b.x1<q.x2+MARGIN&&b.x2>q.x1-MARGIN&&b.y1<q.y2+MARGIN&&b.y2>q.y1-MARGIN);
    const toLabel=selectedId?(s>=1.5?visible:visible.filter(p=>p.id===selectedId)):visible;
    const sorted=[...toLabel].sort((a,b)=>a.id===selectedId?1:b.id===selectedId?-1:0);
    for(const p of sorted){
      const[cx2,cy2]=wToC(p.x,p.z);
      const col=catColor(p.cat),isSel=p.id===selectedId,r=isSel?8:4.5;
      const BH=LH+(isSel?CLH:0);
      ctx.font=`${isSel?"bold ":""}${fs}px Georgia,serif`;
      const tw=ctx.measureText(p.name).width;
      const DIRS=[[r+5,-LH/2],[-(tw+r+5),-LH/2],[-tw/2,-(r+BH)],[-tw/2,r+4],[r+4,-(r+BH)],[-(tw+r+4),-(r+BH)],[r+4,r+4],[-(tw+r+4),r+4]];
      let lx=cx2+r+5,topY=cy2-LH/2,placed_ok=false;
      for(const[ox2,oy2]of DIRS){
        const tx=cx2+ox2,ty=cy2+oy2,box={x1:tx-2,y1:ty-2,x2:tx+tw+4,y2:ty+BH+2};
        if(ok(box)){lx=tx;topY=ty;placed.push(box);placed_ok=true;break;}
      }
      if(!placed_ok)placed.push({x1:lx-2,y1:topY-2,x2:lx+tw+4,y2:topY+BH+2});
      const lcx=lx+tw/2,lcy=topY+BH/2;
      if(Math.hypot(lcx-cx2,lcy-cy2)>r+10){
        ctx.strokeStyle=col+"33";ctx.lineWidth=0.8;
        ctx.beginPath();ctx.moveTo(cx2,cy2);
        ctx.lineTo(Math.max(lx,Math.min(lx+tw,cx2)),Math.max(topY,Math.min(topY+BH,cy2)));
        ctx.stroke();
      }
      ctx.fillStyle="rgba(8,4,1,0.9)";ctx.fillRect(lx-2,topY,tw+4,BH);
      ctx.strokeStyle=col+"55";ctx.lineWidth=0.5;ctx.strokeRect(lx-2,topY,tw+4,BH);
      ctx.fillStyle=isSel?"#f0d870":col;
      ctx.font=`${isSel?"bold ":""}${fs}px Georgia,serif`;
      ctx.textAlign="left";ctx.fillText(p.name,lx,topY+LH-2);
      if(isSel||s>2.5){
        ctx.font=`${CFS}px Georgia,serif`;ctx.fillStyle=col+"88";
        ctx.fillText(`${p.x}, ${p.y??'?'}, ${p.z}`,lx,topY+LH+CLH-2);
      }
    }
  }
  updateSelCard();
}

// ── Resize ────────────────────────────────────────────────
function resize(){
  canvas.width=mapWrap.clientWidth||window.innerWidth;
  canvas.height=mapWrap.clientHeight||(window.innerHeight-52);
  redraw();
}
window.addEventListener("resize",resize);
new ResizeObserver(resize).observe(mapWrap);

// ── Hit test ──────────────────────────────────────────────
function getCanvasXY(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return[(clientX-r.left)*(canvas.width/r.width),(clientY-r.top)*(canvas.height/r.height)];
}
function hitTest(sx,sy){
  let hit=null,best=24;
  for(const p of pins){
    if(hiddenCats.has(p.cat))continue;
    const[cx2,cy2]=wToC(p.x,p.z);
    const d=Math.hypot(sx-cx2,sy-cy2);
    if(d<best){best=d;hit=p;}
  }
  return hit;
}

// ── Mouse ─────────────────────────────────────────────────
canvas.addEventListener("mousedown",e=>{isPanning=true;panStart={x:e.clientX,y:e.clientY};panAtStart={...pan};});
canvas.addEventListener("mousemove",e=>{if(!isPanning)return;pan={x:panAtStart.x+(e.clientX-panStart.x),y:panAtStart.y+(e.clientY-panStart.y)};redraw();});
canvas.addEventListener("mouseup",e=>{
  const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;isPanning=false;
  if(Math.hypot(dx,dy)<5){const[sx,sy]=getCanvasXY(e.clientX,e.clientY);setSelected(hitTest(sx,sy)?.id??null);}
});
canvas.addEventListener("mouseleave",()=>{isPanning=false;});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const[sx,sy]=getCanvasXY(e.clientX,e.clientY),f=e.deltaY<0?1.15:0.87;
  const ns=Math.max(0.3,Math.min(30,sc*f));
  pan={x:sx-(sx-pan.x)*(ns/sc),y:sy-(sy-pan.y)*(ns/sc)};sc=ns;redraw();
},{passive:false});

// ── Touch ─────────────────────────────────────────────────
canvas.addEventListener("touchstart",e=>{
  e.preventDefault();
  if(e.touches.length===1){isPanning=true;panStart={x:e.touches[0].clientX,y:e.touches[0].clientY};panAtStart={...pan};pinchStart=null;}
  else if(e.touches.length===2){isPanning=false;const t0=e.touches[0],t1=e.touches[1];pinchStart={dist:Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY),sc,px:pan.x,py:pan.y,mx:(t0.clientX+t1.clientX)/2,my:(t0.clientY+t1.clientY)/2};}
  lastTouches=[...e.touches];
},{passive:false});
canvas.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length===1&&isPanning){pan={x:panAtStart.x+(e.touches[0].clientX-panStart.x),y:panAtStart.y+(e.touches[0].clientY-panStart.y)};redraw();}
  else if(e.touches.length===2&&pinchStart){
    const t0=e.touches[0],t1=e.touches[1];
    const dist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
    const ps=pinchStart,ns=Math.max(0.3,Math.min(30,ps.sc*(dist/ps.dist)));
    const[mx,my]=getCanvasXY(ps.mx,ps.my);
    sc=ns;pan={x:mx-(mx-ps.px)*(ns/ps.sc),y:my-(my-ps.py)*(ns/ps.sc)};redraw();
  }
},{passive:false});
canvas.addEventListener("touchend",e=>{
  e.preventDefault();
  if(e.changedTouches.length===1&&lastTouches.length===1&&e.touches.length===0){
    const t=e.changedTouches[0],t0=lastTouches[0];
    if(Math.hypot(t.clientX-t0.clientX,t.clientY-t0.clientY)<8){
      const[sx,sy]=getCanvasXY(t.clientX,t.clientY);setSelected(hitTest(sx,sy)?.id??null);
    }
  }
  isPanning=false;lastTouches=[...e.touches];
},{passive:false});

// ── Selected card ─────────────────────────────────────────
function setSelected(id){selectedId=id;updateSelCard();redraw();}

function updateSelCard(){
  const p=pins.find(p=>p.id===selectedId);
  if(!p){selCard.style.display="none";return;}
  const col=catColor(p.cat),sym=catSym(p.cat);
  selCard.style.display="flex";
  selCard.style.border=`1px solid ${col}88`;
  selCard.style.boxShadow=`0 0 18px ${col}22`;
  selCard.innerHTML=`
    <div style="color:${col};font-size:16px;flex-shrink:0;width:20px;text-align:center">${sym}</div>
    <div style="min-width:0;flex:1">
      <div style="color:${col};font-weight:bold;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Georgia,serif">${p.name}</div>
      <div style="color:#6a4a20;font-size:11px;margin-top:2px;font-family:Georgia,serif">${p.x}, ${p.y??'?'}, ${p.z} · ${p.cat}</div>
    </div>
    <button class="btn" id="edit-sel-btn" style="font-size:11px;padding:4px 8px">Edit</button>
    <button class="btn" id="close-sel-btn" style="font-size:11px;padding:4px 8px">✕</button>
  `;
  document.getElementById("edit-sel-btn").onclick=()=>openEdit(p);
  document.getElementById("close-sel-btn").onclick=()=>setSelected(null);
}

// ── Fly to ────────────────────────────────────────────────
function flyTo(p){
  const W=canvas.width,H=canvas.height;
  const nx=(p.x-bounds.minX)/(bounds.maxX-bounds.minX);
  const nz=(p.z-bounds.minZ)/(bounds.maxZ-bounds.minZ);
  const ts=Math.max(sc,3);
  sc=ts;pan={x:W/2-nx*W*ts,y:H/2-nz*H*ts};
  setSelected(p.id);closeSheet();redraw();
}

// ── Zoom buttons ──────────────────────────────────────────
function zoomBtn(f){
  const sx=canvas.width/2,sy=canvas.height/2;
  const ns=Math.max(0.3,Math.min(30,sc*f));
  pan={x:sx-(sx-pan.x)*(ns/sc),y:sy-(sy-pan.y)*(ns/sc)};sc=ns;redraw();
}
document.getElementById("btn-zoomin").onclick=()=>zoomBtn(1.4);
document.getElementById("btn-zoomout").onclick=()=>zoomBtn(1/1.4);
document.getElementById("btn-reset").onclick=resetView;

}

// ── Filter ────────────────────────────────────────────────
function renderFilter(){
  let html=`<div class="sec"><div class="sec-title">Categories <span style="color:#3a2508;font-weight:normal;font-size:11px">— tap to hide/show</span></div>`;
  for(const c of CATS){
    const h=hiddenCats.has(c.name);
    html+=`<div class="cat-row" data-cat="${c.name}" style="opacity:${h?0.4:1};background:${h?"rgba(255,255,255,0.01)":"rgba(255,255,255,0.03)"};border:1px solid ${h?"#1a0f04":c.color+"44"}">
      <span style="font-size:14px;color:${c.color};width:20px;text-align:center">${c.sym}</span>
      <div style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0"></div>
      <span style="flex:1;font-size:13px;color:${h?"#3a2508":c.color};font-family:Georgia,serif">${c.name}</span>
      <span style="font-size:11px;padding:2px 8px;border-radius:3px;color:${h?"#802020":"#406020"};background:${h?"#180808":"#081008"};border:1px solid ${h?"#2a0808":"#081808"};font-family:Georgia,serif">${h?"off":"on"}</span>
    </div>`;
  }
  html+=`<button class="full-btn full-btn-amber" id="show-all-btn" style="margin-top:8px">Show All</button></div>`;
  sheetContent.innerHTML=html;
  sheetContent.querySelectorAll(".cat-row").forEach(el=>{el.onclick=()=>{toggleCat(el.dataset.cat);renderFilter();};});
  document.getElementById("show-all-btn").onclick=()=>{hiddenCats=new Set();renderFilter();redraw();};
}
function toggleCat(name){hiddenCats.has(name)?hiddenCats.delete(name):hiddenCats.add(name);redraw();}

// ── List — search stays focused ───────────────────────────
function renderList(){
  sheetContent.innerHTML=`
    <div style="padding:6px 12px 8px;border-bottom:1px solid #2a1808;flex-shrink:0">
      <input class="inp" id="search-inp" placeholder="Search locations…" autocomplete="off" autocorrect="off" spellcheck="false" style="font-size:14px;padding:8px 10px" value="${escHtml(searchText)}"/>
    </div>
    <div class="sh-body" id="pins-list"></div>
    <div class="sh-foot"><button class="full-btn full-btn-amber" id="add-from-list">＋ Add New Pin</button></div>
  `;
  const inp=document.getElementById("search-inp");
  inp.addEventListener("input",e=>{searchText=e.target.value;renderPinRows();});
  inp.addEventListener("click",e=>e.stopPropagation());
  document.getElementById("add-from-list").onclick=openAdd;
  renderPinRows();
}
function renderPinRows(){
  const container=document.getElementById("pins-list");
  if(!container)return;
  const q=searchText.toLowerCase();
  const filtered=pins.filter(p=>p.name.toLowerCase().includes(q)||String(p.x).includes(q)||String(p.z).includes(q));
  if(!filtered.length){container.innerHTML=`<div style="color:#3a2508;text-align:center;padding:32px;font-family:Georgia,serif">No pins found</div>`;return;}
  let html="";
  for(const p of filtered){
    const isSel=p.id===selectedId,col=catColor(p.cat),sym=catSym(p.cat);
    html+=`<div class="pin-row" data-id="${p.id}" style="border-left:3px solid ${isSel?col:"transparent"};background:${isSel?"rgba(212,168,67,0.05)":"transparent"}">
      <span style="font-size:14px;color:${col};width:20px;text-align:center;flex-shrink:0">${sym}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;color:${isSel?"#f0d870":"#c09040"};font-weight:${isSel?"bold":"normal"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Georgia,serif">${escHtml(p.name)}</div>
        <div style="font-size:10px;color:#4a2a10;margin-top:1px;font-family:Georgia,serif">${p.x}, ${p.y??'?'}, ${p.z}</div>
      </div>
      <div style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></div>
    </div>`;
  }
  container.innerHTML=html;
  container.querySelectorAll(".pin-row").forEach(el=>{
    el.onclick=()=>{const p=pins.find(p=>p.id===el.dataset.id);if(p)flyTo(p);};
  });
}

// ── Form ──────────────────────────────────────────────────
function openAdd(){editPin=null;form={name:"",x:"",y:"64",z:"",cat:"Home Base"};openSheet("add");}
function openEdit(p){editPin=p;form={name:p.name,x:String(p.x),y:String(p.y??64),z:String(p.z),cat:p.cat};openSheet("add");}

function renderForm(){
  let catPicks="";
  for(const c of CATS){
    const sel=form.cat===c.name;
    catPicks+=`<div class="chip" data-cat="${c.name}" style="border:1px solid ${sel?c.color:"#2a1808"};background:${sel?c.color+"22":"transparent"};color:${sel?c.color:"#6a4a20"}">${c.sym} ${c.name}</div>`;
  }
  sheetContent.innerHTML=`<div class="form-wrap">
    <div class="form-hdr">
      <span style="color:#d4a843;font-weight:bold;font-size:14px;font-family:Georgia,serif">${editPin?"Edit Pin":"Add Pin"}</span>

    </div>
    <label class="lbl">Name</label>
    <input class="inp" id="f-name" value="${escHtml(form.name)}" placeholder="e.g. My Base" style="margin-bottom:12px" autocomplete="off"/>
    <div class="row3">
      <div><label class="lbl">X</label><input class="inp" id="f-x" type="number" value="${form.x}" placeholder="424"/></div>
      <div><label class="lbl">Y</label><input class="inp" id="f-y" type="number" value="${form.y}" placeholder="64"/></div>
      <div><label class="lbl">Z</label><input class="inp" id="f-z" type="number" value="${form.z}" placeholder="-100"/></div>
    </div>
    <label class="lbl">Category</label>
    <div class="cat-pick">${catPicks}</div>
    <button class="full-btn full-btn-amber" id="submit-form-btn" style="font-weight:bold">${editPin?"Save Changes":"Add to Map"}</button>
    ${editPin?`<button class="full-btn full-btn-red" id="delete-pin-btn">Delete Pin</button>`:""}
  </div>`;
  sheetContent.querySelectorAll("input").forEach(el=>el.addEventListener("click",e=>e.stopPropagation()));
  document.getElementById("close-form-btn").onclick=closeSheet;
  document.getElementById("submit-form-btn").onclick=submitForm;
  if(editPin)document.getElementById("delete-pin-btn").onclick=()=>deletePin(editPin.id);
  sheetContent.querySelectorAll(".chip").forEach(el=>{el.onclick=()=>{form.cat=el.dataset.cat;renderForm();};});
  ["name","x","y","z"].forEach(k=>{document.getElementById("f-"+k).oninput=e=>{form[k]=e.target.value;};});
}

async function submitForm(){
  const name=document.getElementById("f-name").value.trim();
  const x=parseInt(document.getElementById("f-x").value);
  const y=parseInt(document.getElementById("f-y").value);
  const z=parseInt(document.getElementById("f-z").value);
  if(!name||isNaN(x)||isNaN(y)||isNaN(z)){showToast("Fill all fields");return;}
  let next;
  if(editPin){next=pins.map(p=>p.id===editPin.id?{...p,name,x,y,z,cat:form.cat}:p);selectedId=editPin.id;}
  else{const np={id:Date.now().toString(),name,x,y,z,cat:form.cat};next=[...pins,np];selectedId=np.id;}
  await savePins(next);showToast(editPin?"Updated!":"Added!");closeSheet();editPin=null;
  updateSelCard();redraw();
}
async function deletePin(id){
  await savePins(pins.filter(p=>p.id!==id));
  if(selectedId===id){selectedId=null;updateSelCard();}
  showToast("Deleted");closeSheet();
}

    <button id="copy-id-btn" style="width:100%;padding:10px;background:#1a1004;color:#d4a843;border:1px solid #6a4a20;border-radius:5px;font-family:Georgia,serif;font-size:13px;cursor:pointer;margin-bottom:12px">${id?"Copy Sync ID":"⚠ No ID available"}</button>
    <div style="color:#3a2508;font-size:11px;margin:0 0 10px;text-align:center">— or paste a Sync ID from another device —</div>
    <input id="paste-id-inp" placeholder="Paste Sync ID here…" style="background:#0c0702;color:#d4c080;border:1px solid #3a2508;padding:9px 10px;font-family:Georgia,serif;font-size:12px;width:100%;border-radius:4px;outline:none;margin-bottom:10px"/>
    <button id="apply-id-btn" style="width:100%;padding:10px;background:#140c04;color:#a07830;border:1px solid #3a2508;border-radius:5px;font-family:Georgia,serif;font-size:13px;cursor:pointer;margin-bottom:10px">Use This Sync ID</button>
    <button id="close-sync-btn" style="width:100%;padding:8px;background:transparent;color:#4a2a10;border:1px solid #2a1808;border-radius:5px;font-family:Georgia,serif;font-size:12px;cursor:pointer">Close</button>
  `;
  modal.appendChild(box);document.body.appendChild(modal);
  box.querySelector("#copy-id-btn").onclick=()=>{
    const inp=box.querySelector("#sync-id-inp");inp.select();
    navigator.clipboard?.writeText(inp.value).catch(()=>{const r=document.createRange();r.selectNode(inp);window.getSelection().removeAllRanges();window.getSelection().addRange(r);});
    box.querySelector("#copy-id-btn").textContent="✓ Copied!";
  };
  box.querySelector("#apply-id-btn").onclick=async()=>{
    const nid=box.querySelector("#paste-id-inp").value.trim();if(!nid)return;
    setBinId(nid);box.querySelector("#apply-id-btn").textContent="Loading…";
    const remote=await binLoad();
    if(remote){pins=remote;localSet(pins);computeBounds();redraw();updateSelCard();showToast("Synced!");}
    else showToast("Couldn't load that ID");
    document.body.removeChild(modal);
  };
  box.querySelector("#close-sync-btn").onclick=()=>document.body.removeChild(modal);
  modal.onclick=e=>{if(e.target===modal)document.body.removeChild(modal);};
};

// ── Utils ─────────────────────────────────────────────────
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
</script>
</body>
</html>
